<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    form {
      width: 320px;
      display: flex;
      flex-direction: column;
    }

    input {
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #2a2a2a;
      color: #ffffff;
      font-size: 14px;
    }

    input::placeholder {
      color: #888;
    }

    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: #ffffff;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile-icon {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-icon"></div>
    <form method="POST">
      <input name="username" placeholder="Username">
      <input type="password" name="password" placeholder="Password">
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
