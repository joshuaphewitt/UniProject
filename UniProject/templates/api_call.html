<!DOCTYPE html>
<html>
  <body>
    <style>
      .input-group {
        display: flex;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #ccc;
        max-width: 600px;
        margin-bottom: 1em;
        width: 100%;
      }
      .input-group select,
      .input-group button {
        border: none;
        padding: 0.5em 1em;
        font-size: 1em;
        outline: none;
        flex: 0 0 auto;
      }
      .input-group input {
        border: none;
        padding: 0.5em 1em;
        font-size: 1em;
        outline: none;
        flex: 1 1 auto;
        min-width: 0;
      }
      .input-group select {
        background-color: #f0f0f0;
        border-right: 1px solid #ccc;
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
      }
      .input-group button {
        background-color: #007bff;
        color: white;
        cursor: pointer;
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        transition: background-color 0.3s;
      }
      .input-group button:hover {
        background-color: #0056b3;
      }
      textarea#body_content {
        width: 100%;
        max-width: 600px;
        height: 150px;
        margin-top: 1em;
        padding: 0.5em 1em;
        font-size: 1em;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: vertical;
        font-family: inherit;
        box-sizing: border-box;
      }
    </style>
    <h1>API call</h1>

    <form method="POST">
        <div class="input-group">
            <select name="method">
                <option value="GET" selected>GET</option>
                <option value="POST">POST</option>
            </select>
            <input name="url" type="text" placeholder="https://api.example.com/data">
            <button type="submit">Test</button>
        </div>

        <h3>Headers</h3>
          <table id="headers-table">
            <thead>
              <tr>
                <th>Header Name</th>
                <th>Header Value</th>
                <th>Remove</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input name="header_name_0" type="text" placeholder="Authorization"></td>
                <td><input name="header_value_0" type="text" placeholder="Bearer TOKEN"></td>
                <td><button type="button" onclick="removeRow(this)">X</button></td>
              </tr>
            </tbody>
          </table>
          <button type="button" onclick="addRow()">Add Header</button>

          <textarea id="body_content" name="body_content" placeholder="Enter POST body here..."></textarea>
    </form>

    {% if api_result %}
      <h3>API Response</h3>
      <pre>{{ api_result }}</pre>
    {% endif %}
  </body>

  <script>
let headerIndex = 1;

function addRow() {
  const tbody = document.querySelector("#headers-table tbody");
  const row = document.createElement("tr");
  row.innerHTML = `
    <td><input name="header_name_${headerIndex}" type="text" placeholder="Header Name"></td>
    <td><input name="header_value_${headerIndex}" type="text" placeholder="Header Value"></td>
    <td><button type="button" onclick="removeRow(this)">X</button></td>
  `;
  tbody.appendChild(row);
  headerIndex++;
}

function removeRow(button) {
  button.closest("tr").remove();
}
</script>

</html>
